[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readmap"
version = "0.2.0"
description = "A pipeline for academic paper deep-reading, Notion sync, and wiki knowledge mapping."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sun Haotong", email = "richsun821@gmail.com"},
]
keywords = ["academic", "paper", "notion", "markdown", "research", "wiki"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
figures = [
    "figure-extractor @ git+https://github.com/Sunrich-HT/figure-extractor",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
readmap = "readmap.cli:main"

[project.urls]
Homepage = "https://github.com/Sunrich-HT/ReadMap"
Repository = "https://github.com/Sunrich-HT/ReadMap"
Issues = "https://github.com/Sunrich-HT/ReadMap/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
